<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Emmy J Code</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/media-player.css">
<link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#5b4bdb"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><main class="container"><div class="form card"><a class="brand" href="../index.html">✨ Emmy J Code</a><h1>Create your account</h1><p class="muted">Choose your account type first, then enter your details.</p><form id="registerForm">
<label>Account type</label><select name="type" required><option value="student">Student</option><option value="teacher">Teacher</option></select>
<label>Full name</label><input name="name" required placeholder="Your full name">
<label>Email / Gmail</label><input type="email" name="email" required placeholder="you@example.com">
<label>Phone</label><input name="phone" required placeholder="+234...">
<label>Country</label><input name="country" required placeholder="Nigeria">
<label>Username</label><input name="username" required>
<label>Password</label><input type="password" name="password" required>
<label>Profile avatar</label><select name="avatar"><option>🙂</option><option>🧑🏽‍💻</option><option>👩🏽‍💻</option><option>🚀</option><option>⭐</option><option>🎓</option></select>
<button class="btn btn-primary" type="submit">Create account</button></form><div id="msg"></div><div id="backendStatus" class="muted" style="margin-top:10px;font-size:.9rem"></div><p>Already registered? <a href="login.html">Log in</a></p></div></main><script src="../js/app.js"></script><script src="../js/auth-api.js"></script><script src="../js/register.js"></script>
<script src="../js/media-player.js" defer></script>
<script src="../js/pwa.js" defer></script><script>
(async()=>{const el=document.getElementById('backendStatus');try{const base=((location.hostname==='localhost'||location.hostname==='127.0.0.1')&&location.port!=='3000')?'http://localhost:3000':'';const r=await fetch(base+'/api/health',{credentials:'include'});const d=await r.json().catch(()=>({}));el.textContent=d.ok?'✓ Backend connected':'⚠ Backend/database needs setup';}catch{el.textContent='⚠ Start the backend with npm start, then open http://localhost:3000';}})();
</script></body></html>
