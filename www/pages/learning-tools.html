<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Tools — Emmy J Code</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/media-player.css">
<link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#5b4bdb"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html"><span class="brand-mark">EJ</span><span>Emmy J Code</span></a><div class="profile-chip"><span class="avatar" data-user-avatar>🙂</span><span data-user-name>Learner</span><button class="btn btn-ghost" onclick="EmmyJ.logout()">Log out</button></div></div></header><main class="container" style="padding:42px 0 70px"><span class="eyebrow">Study center</span><h1>Learning tools</h1><p class="muted">Review weak topics, keep personal notes, and save lessons for later.</p><div class="grid grid-2" style="margin-top:22px"><section class="card"><span class="badge">🔁 Revision</span><h2>Topics to review</h2><div id="weak" class="muted">Loading…</div></section><section class="card"><span class="badge">🔖 Bookmarks</span><h2>Saved lessons</h2><div id="bookmarks" class="muted">Loading…</div></section></div><section class="card" style="margin-top:20px"><span class="badge">🔔 Notifications</span><h2>Recent updates</h2><button class="btn btn-secondary" id="readAll">Mark all as read</button><div id="notifications" style="margin-top:15px"></div></section></main><script src="../js/app.js"></script><script src="../js/auth-api.js"></script><script src="../js/learning-tools.js"></script><script>
(async()=>{try{const [r,b,n]=await Promise.all([EmmyLearning.revision(),EmmyLearning.bookmarks(),EmmyLearning.notifications()]);const w=document.querySelector('#weak');w.innerHTML=r.weakTopics.length?r.weakTopics.map(x=>`<div class="mini-row" style="padding:10px 0;border-bottom:1px solid #eee"><span>${x.lesson_id}</span><strong>${x.best_score}%</strong></div>`).join(''):'<p>No weak topics yet. Keep going! 🎉</p>';document.querySelector('#bookmarks').innerHTML=b.bookmarks.length?b.bookmarks.map(x=>`<div class="mini-row" style="padding:10px 0;border-bottom:1px solid #eee"><a href="../lessons/${x.lesson_id}.html">${x.lesson_id}</a><button class="btn btn-ghost" onclick="EmmyLearning.removeBookmark('${x.lesson_id}').then(()=>location.reload())">Remove</button></div>`).join(''):'<p>No bookmarks yet.</p>';document.querySelector('#notifications').innerHTML=n.notifications.length?n.notifications.map(x=>`<div class="card" style="margin:10px 0;padding:14px;${x.is_read?'':'border-left:4px solid #6d4aff'}"><strong>${x.title}</strong><p style="margin:5px 0">${x.message}</p><small class="muted">${new Date(x.created_at).toLocaleString()}</small>${x.is_read?'':`<button class="btn btn-ghost" onclick="EmmyLearning.markRead(${x.id}).then(()=>location.reload())">Mark read</button>`}</div>`).join(''):'<p class="muted">No notifications.</p>';}catch(e){document.querySelector('main').insertAdjacentHTML('beforeend',`<div class="card">${e.message}</div>`);}})();document.querySelector('#readAll').onclick=()=>EmmyLearning.readAll().then(()=>location.reload());
</script><script src="../js/media-player.js" defer></script>
<script src="../js/pwa.js" defer></script></body></html>
